name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Add Helm dependencies
        run: |
          for dir in $(ls -d charts/*/); do
            helm dependency list $dir 2> /dev/null | tail +2 | head -n -1 | awk '{ print "helm repo add " $1 " " $3 }' | while read cmd; do $cmd; done
          done

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # Every push to main that bumps a Chart.yaml version is a stable release.
      # Mirroring it as an OCI artifact on GHCR
      # GitHub Pages Helm repo index to be regenerated.
      - name: Package charts for GHCR (OCI)
        run: |
          mkdir -p .oci-release-packages
          for dir in $(ls -d charts/*/); do
            helm package "$dir" --destination .oci-release-packages
          done

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Push charts to GHCR (OCI)
        run: |
          for pkg in .oci-release-packages/*.tgz; do
            helm push "$pkg" "oci://ghcr.io/${{ github.repository_owner }}/phrasea-helm-charts"
          done
