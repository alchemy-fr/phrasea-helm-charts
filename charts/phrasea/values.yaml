    # The subchart job relies on a rabbitmqctl 3.7 client, not compatible with RabbitMQ 3.13.
    setupVhost: false
    # Shared RabbitMQ service of the stack (the zippy one is disabled): keep in sync with rabbitmq.host
    host: rabbitmq
    # Credentials read from the Secret of the stack RabbitMQ (rabbitmq.*).
    # Set to rabbitmq.externalSecretName when the stack uses an external Secret.
    externalSecretName: rabbitmq-secret
    externalSecretMap:
