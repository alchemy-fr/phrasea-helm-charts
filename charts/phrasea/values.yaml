databox:
  enabled: true
  # this option enable the import of fixtures after setup
  # warning: this will erase existing data in databases.
  importFixtures: false
  cronJob:
    enabled: true
    # Daily at 3am
    schedule: '0 3 * * *'
  allowedFileTypes: "image/*(.jpg,.jpeg,.bmp,.tif,.gif,.png,.heic,.webp,.svg,.psd,.psb,.ai),application/*(.pdf,.doc,.docx,.md,.txt,.xls,.xlsx,.odt,.psd,.psb),video/*(.mpg,.mpeg,.mov,.avi,.mxf,.mp2,.mp4,.m4v,.m4a,.mkv,.hevc,.webm),audio/*(.ogg,.opus,.m4r,.ac3,.flac,.aac,.wav,.mp3,.aac,.aiff,.wav)"
  # Min size for multipart upload chunks in bytes (default 20Mb) - must be at least 5Mb for AWS S3 and some S3-compatible providers
  s3MultipartMinChunkSize: "20971520"
  # Max size for multipart upload chunks in bytes (default 5Gb)
  s3MultipartMaxChunkSize: "5368709120"
  # Max number of parts for multipart upload
  s3MultipartMaxPartNumber: "10000"
  # Max object size for multipart upload in bytes (default 48.8 TiB)
  s3MaxObjectSize: "52776558133248"
  api:
    replicas: 1
    ingress:
      enabled: true
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "2G"
      extraLabels: {}
      maxBodySize: 2G
      tls: []
    hostname: "api-databox.{{ .Values.stack.domain }}"
    baseUrl: "https://api-databox.{{ .Values.stack.domain }}"
    # Override global resourceQuota for this service (true/false), defaults to global value
    # resourceQuota:
    resources:
      requests:
        cpu: "50m"
        memory: "256Mi"
      limits:
        cpu: "2000m"
        memory: "2048Mi"
    config:
      requestSignatureTtl: 86400
      s3Storage:
        # When using an external object storage provider, set the "endpoint" to the root domain of the service.
        # Example: https://s3.my-s3-provider.com
        # The "bucketName" will be prepended to this endpoint to form the full bucket URL (e.g., https://<bucketName>.s3.my-s3-provider.com).
        endpoint: "{{ tpl .Values.minio.baseUrl . }}"
        region:
        bucketName: databox
        # true for a local minio, false for an external object storage provider
        usePathStyleEndpoint: true 
        # Can be used to support a single CloudFront distribution with multiple origins
        pathPrefix: ''
        accessKey: "{{ .Values.minio.accessKey }}"
        secretKey: "{{ .Values.minio.secretKey }}"
        externalSecretKey:
        externalSecretMapping:
          accessKey: S3_ACCESS_KEY
          secretKey: S3_SECRET_KEY
      cloudFront:
        url:
        region:
        privateKey:
        keyPairId:
        ttl: 86400
      phraseanet:
        baseUrl:
        oauthToken:
      secrets:
        # __SET_ME__ sodium public/private key pair
        publicKey:
        # __SET_ME__
        secretKey:
  adminOAuthClient:
    externalSecretName:
    id: databox-admin
    secret: '__CHANGE_ME_9jZuZqkwf9qW881jTqG'
  client:
    hostname: "databox.{{ .Values.stack.domain }}"
    baseUrl: "https://databox.{{ .Values.stack.domain }}"
    # Override global resourceQuota for this service (true/false), defaults to global value
    # resourceQuota:
    resources:
      requests:
        cpu: "25m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    ingress:
      enabled: true
      annotations: {}
      extraLabels: {}
      tls: []
    oauthClient:
      id: databox-app
  worker:
    replicas: 1
    # Override global resourceQuota for this service (true/false), defaults to global value
    # resourceQuota:
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
  rabbitmq:
    vhost: databox
  database:
    name: databox
  upload:
    uploaderTargetSlug: databox-uploader
  zippy:
    enabled: true
    baseUrl: "https://zippy.{{ .Values.stack.domain }}"
