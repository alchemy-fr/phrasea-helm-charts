repository:
  baseUrl: alchemyfr
  # __SET_ME__  Set a fixed version, do not use "latest" in production
  tag: latest
  imagePullPolicy: IfNotPresent

stack:
  # __SET_ME__ Custom stack name to distinguish multiple stacks
  name:
  # __SET_ME__ Domain used to auto-generate all service URLs (e.g., example.com generates keycloak.example.com, databox.example.com, etc.)
  domain:
  running: true
  runSetups: true
  runMigrations: true
  runSynchronize: true


# Override full name of the deployed resources (e.g., phrasea-stg) useful for multiple certbot in the same cluster.
fullnameOverride: phrasea

# Enable resource requests/limits for all deployments (required for cluster-autoscaler)
resourceQuota: true

acme:
  enabled: false
  # Email for Let's Encrypt notifications
  email:
  # Use production Let's Encrypt server (true) or staging (false)
  production: false
  # Root domain for wildcard certificate (e.g., example.com generates *.example.com)
  # Uses stack.domain by default
  rootHost: "{{ .Values.stack.domain }}"
  # DNS provider for DNS-01 challenge (gandi, scaleway, route53)
  provider:
  
  # Scaleway DNS configuration (https://www.scaleway.com/en/dns/)
  scaleway:
    # Scaleway Access Key (from IAM API Key)
    accessKey:
    # Scaleway Secret Key (from IAM API Key)
    secretKey:
    # Secret name if using existing secret
    existingSecretName:
    existingSecretAccessKeyKey:
    existingSecretSecretKeyKey:
  
  # Gandi LiveDNS v5 configuration
  gandi:
    # Personal Access Token from https://account.gandi.net/en/users/USER/security
    # Required permissions: "Manage domain name technical configurations"
    personalAccessToken:
    existingSecretName:
    existingSecretKey:
  
  # AWS Route53 configuration
  route53:
    region:
    # IAM access key with Route53 permissions
    accessKeyId:
    secretAccessKey:
    # Hosted Zone ID
    hostedZoneId:
    existingSecretName:
    existingSecretKey:

# __SET_ME__ TLS configuration
ingress:
  tls:
    wildcard:
      # set to true to enable TLS for wildcard domains (*.example.com)
      enabled: false
      # Name of the TLS secret containing the wildcard certificate
      # Default: <release-name>-ps-wildcard-tls (e.g., phrasea-ps-wildcard-tls)
      # With fullnameOverride: <fullnameOverride>-wildcard-tls (e.g., phrasea-stg-wildcard-tls)
      externalSecretName:
      # Alternative: provide your own certificate and key
      crt:
      key:


security:
  verifySsl: true
  verifyHost: true


image:
  pullSecret:
    enabled: false
    name: registry-secret
    registry:
    username:
    password:
    email:

nodeSelector:

configurator:
  # can be "test", "dev"
  presets:
  configure:
    database: true
    keycloak: true
    minio: false
    rabbitmq: true
    s3: true
  serviceWaitTimeout: 300
  database:
    name: configurator
  s3:
    # When using an external object storage provider, set the "endpoint" to the root domain of the service.
    # Example: https://s3.my-s3-provider.com
    # The "bucketName" will be prepended to this endpoint to form the full bucket URL (e.g., https://<bucketName>.s3.my-s3-provider.com).
    endpoint: "{{ tpl .Values.minio.baseUrl . }}"
    # required for some object storage providers
    region:
    bucketName: config
    # True for a local minio, false for an external object storage provider
    usePathStyleEndpoint: true 
    # Can be used to support a single CloudFront distribution with multiple origins
    pathPrefix: ''
    accessKey: "{{ .Values.minio.accessKey }}"
    secretKey: "{{ .Values.minio.secretKey }}"
    externalSecretKey:
    externalSecretMapping:
      accessKey: CONFIGURATOR_S3_ACCESS_KEY
      secretKey: CONFIGURATOR_S3_SECRET_KEY

interactivePod:
  # Set to true to launch an interactive pod for debugging
  enabled: false


