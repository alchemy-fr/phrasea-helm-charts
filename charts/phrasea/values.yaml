    username: admin
    # __SET_ME__
    password: __CHANGE_ME_obIaHz6cVTkQKHqLBj
  defaultAdmin:
    # __SET_ME__  username must be in email format OR define stack.domain to auto-generate it
    username: phrasea-admin@xxx.zz
    # __SET_ME__
    password: __CHANGE_ME_KFBsKzc7RupJhXkr
