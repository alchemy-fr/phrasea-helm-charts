        cpu: "2000m"
        memory: "2048Mi"
    config:
      requestSignatureTtl: 86400
      s3Storage:
        # When using an external object storage provider, set the "endpoint" to the root domain of the service.
        # Example: https://s3.my-s3-provider.com
        # The "bucketName" will be prepended to this endpoint to form the full bucket URL (e.g., https://<bucketName>.s3.my-s3-provider.com).
        endpoint: "{{ tpl .Values.minio.baseUrl . }}"
        region: eu-west-3
        bucketName: expose
        # true for a local minio, false for an external object storage provider
        usePathStyleEndpoint: true
        # Can be used to support a single CloudFront distribution with multiple origins
        pathPrefix: ''
        accessKey: "{{ .Values.minio.accessKey }}"
        secretKey: "{{ .Values.minio.secretKey }}"
        externalSecretKey:
        externalSecretMapping:
          accessKey: S3_ACCESS_KEY
          secretKey: S3_SECRET_KEY
      cloudFront:
        url:
