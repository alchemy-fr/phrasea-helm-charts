repository:
  baseUrl: alchemyfr
  # __SET_ME__  Set a fixed version, do not use "latest" in production
  tag: latest
  imagePullPolicy: IfNotPresent

stack:
  # __SET_ME__ Custom stack name to distinguish multiple stacks
  name:
  # __SET_ME__ Domain used to auto-generate all service URLs (e.g., example.com generates keycloak.example.com, databox.example.com, etc.)
  domain:
  running: true
  runSetups: true
  # Also synchronizes the configuration (Keycloak clients, buckets...) through the configurator migration job
  runMigrations: true
  migrations:
    phpMemoryLimit: '1G'


# Override full name of the deployed resources (e.g., phrasea-stg) useful for multiple certbot in the same cluster.
fullnameOverride: phrasea

# Enable resource requests/limits for all deployments (required for cluster-autoscaler)
resourceQuota: true

acme:
  enabled: false
  # Email for Let's Encrypt notifications
  email:
  # Use production Let's Encrypt server (true) or staging (false)
  production: false
  # Root domain for wildcard certificate (e.g., example.com generates *.example.com)
  # Uses stack.domain by default
  rootHost: "{{ .Values.stack.domain }}"
  # DNS provider for DNS-01 challenge (gandi, scaleway, route53)
  provider:
  
  # Scaleway DNS configuration (https://www.scaleway.com/en/dns/)
  scaleway:
    # Scaleway Access Key (from IAM API Key)
    accessKey:
    # Scaleway Secret Key (from IAM API Key)
    secretKey:
    # Secret name if using existing secret
    existingSecretName:
    # Keys of the access/secret keys in the Secret
    existingSecretAccessKeyKey: SCW_ACCESS_KEY
    existingSecretSecretKeyKey: SCW_SECRET_KEY
  
  # Gandi LiveDNS v5 configuration
  gandi:
    # Personal Access Token from https://account.gandi.net/en/users/USER/security
    # Required permissions: "Manage domain name technical configurations"
    personalAccessToken:
    existingSecretName:
    # Key of the token in the Secret
    existingSecretKey: api-token
  
  # AWS Route53 configuration
  route53:
    region: eu-west-3
    # IAM access key with Route53 permissions
    accessKeyId:
    secretAccessKey:
    # Hosted Zone ID
    hostedZoneId:
    existingSecretName:
    existingSecretKey:

# __SET_ME__ TLS configuration
ingress:
  tls:
    wildcard:
      # set to true to enable TLS for wildcard domains (*.example.com)
      enabled: false
      # Name of the TLS secret containing the wildcard certificate
      # Default: <release-name>-ps-wildcard-tls (e.g., phrasea-ps-wildcard-tls)
      # With fullnameOverride: <fullnameOverride>-wildcard-tls (e.g., phrasea-stg-wildcard-tls)
      externalSecretName:
      # Alternative: provide your own certificate and key
      crt:
      key:


security:
  verifySsl: true
  verifyHost: true


image:
  pullSecret:
    enabled: false
    name: registry-secret
    registry:
    username:
    password:
    email:

# Private ECR pull secret refresher. ECR tokens expire every 12h, so a static
# Secret (image.pullSecret above) doesn't work for a private ECR registry.
# When enabled, provisions (pre-install hook) and refreshes (CronJob every 6h)
# a dockerconfigjson pull Secret named `secretName` in the release namespace.
# This Secret is shared across every chart dependency that needs it (e.g.
# phrasea-parade below and any other chart dependencies that require ECR access.
ecrTokenRefresher:
  enabled: false
  # ECR host used as the docker auth key, e.g.
  # 122649456891.dkr.ecr.eu-west-3.amazonaws.com
  registry:
  region: eu-west-3
  secretName: ecr-pull-secret
  # Read-only ECR pull IAM user. Provide via --set or a local secret values
  # file — never commit real values.
  awsAccessKeyId:
  awsSecretAccessKey:

nodeSelector:

configurator:
  # can be "test", "dev"
  presets:
  configure:
    database: true
    keycloak: true
    minio: false
    rabbitmq: true
    s3: true
  serviceWaitTimeout: 300
  database:
    name: configurator
  s3:
    # When using an external object storage provider, set the "endpoint" to the root domain of the service.
    # Example: https://s3.my-s3-provider.com
    # The "bucketName" will be prepended to this endpoint to form the full bucket URL (e.g., https://<bucketName>.s3.my-s3-provider.com).
    endpoint: "{{ tpl .Values.minio.baseUrl . }}"
    # required for some object storage providers
    region: eu-west-3
    bucketName: config
    # True for a local minio, false for an external object storage provider
    usePathStyleEndpoint: true 
    # Can be used to support a single CloudFront distribution with multiple origins
    pathPrefix: ''
    accessKey: "{{ .Values.minio.accessKey }}"
    secretKey: "{{ .Values.minio.secretKey }}"
    externalSecretKey:
    externalSecretMapping:
      accessKey: CONFIGURATOR_S3_ACCESS_KEY
      secretKey: CONFIGURATOR_S3_SECRET_KEY

interactivePod:
  # Set to true to launch an interactive pod for debugging
  enabled: false


keycloak:
  realm:
    name: phrasea
    htmlDisplayName: "<div style=\"font-size: 18px; text-transform: none; color: #000000\"><span>Phrasea Auth</span></div>"
    supportedLocales: "en,fr"
    defaultLocale: en
    loginRegistrationAllowed: false
    loginResetPasswordAllowed: true
    loginRememberMeAllowed: true
    loginWithEmailAllowed: false
    loginVerifyEmailAllowed: false
    loginEmailAsUsername: false
    loginEditUsername: false
    ssoSessionIdleTimeout: "28800"
    ssoSessionMaxLifespan: "43200"
    clientSessionIdleTimeout: "28800"
    clientSessionMaxLifespan: "43200"
    offlineSessionIdleTimeout: "259200"
    offlineSessionMaxLifespan: "604800"
    userEventEnabled: true
    userEventExpiration: "1296000"
    adminEventEnabled: true
    adminEventExpiration: "1296000"
    loginCssBackground: "#f1f1f1"
    loginCssLogoBackground: "url('../../img/logo.png') no-repeat 40% 65%"
    loginDisplayDashboardLink: true
  enabled: true
  autoConnectIdP:
  masterAdmin:
    username: admin
    # __SET_ME__
    password: __CHANGE_ME_obIaHz6cVTkQKHqLBj
  defaultAdmin:
    # __SET_ME__  username must be in email format OR define stack.domain to auto-generate it
    username: phrasea-admin@xxx.zz
    # __SET_ME__
    password: __CHANGE_ME_KFBsKzc7RupJhXkr
    # Optional, defaults to the username (suffixed with @<stack.domain> if it is not an email)
    email:
    # set to true to keep the password as is (do not force change at first login)
    passwordIsDefinitive: false
  database:
    name: keycloak
  hostname: "keycloak.{{ .Values.stack.domain }}"
  baseUrl: "https://keycloak.{{ .Values.stack.domain }}"
  internalBaseUrl: http://keycloak
  # Comma separated list of IPs/CIDRs allowed to set the X-Forwarded-* headers (e.g. the ingress controller pods CIDR).
  # Empty: trust any source.
  proxyTrustedAddresses:
  ingress:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    extraLabels: {}
    tls: []
  # Override global resourceQuota for this service (true/false), defaults to global value
  # resourceQuota:
  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  
# __DEPRECATED__ kept only for 2.0 migration purpose
auth:
  database:
    name: auth

notifications:
  enabled: true

databox:
  enabled: true
  # this option enable the import of fixtures after setup
  # warning: this will erase existing data in databases.
  importFixtures: false
  cronJob:
    enabled: true
    daily:
      enabled: true
      # Daily at 3am
      schedule: '0 3 * * *'
      script: bin/cron-script-daily.sh
    hourly:
      enabled: true
      # Every hour
      schedule: '0 * * * *'
      script: bin/cron-script-hourly.sh
  allowedFileTypes: "image/*(.jpg,.jpeg,.bmp,.tif,.gif,.png,.heic,.webp,.svg,.psd,.psb,.ai,.dng,.jfif,.jpe,.psdt,.emf,.wmf,.svgz,.ait,.eps,.epsf,.epsi,.indd,.indt,.idml,.idms,.icml,.cr2,.cr3,.crw,.nef,.nrw,.arw,.sr2,.srf,.raf,.rw2,.mrw,.orf,.pef,.dcr,.k25,.kdc),application/*(.pdf,.doc,.docx,.md,.txt,.xls,.xlsx,.odt,.psd,.psb,.csv,.ods,.dot,.dotm,.dotx,.docm,.rtf,.wps,.xlam,.xlsb,.xlsm,.xlt,.xltm,.xltx,.xlw,.html,.htm,.mht,.mhtml,.ppt,.pptm,.pptx,.pps,.ppsm,.ppsx,.pot,.potm,.potx,.ppa,.ppam,.ps,.aep,.prproj),video/*(.mpg,.mpeg,.mov,.avi,.mxf,.mp2,.mp4,.m4v,.m4a,.mkv,.hevc,.webm,.wmv),audio/*(.ogg,.opus,.m4r,.ac3,.flac,.aac,.mp3,.aiff,.aif,.wav)"
  # Min size for multipart upload chunks in bytes (default 20Mb) - must be at least 5Mb for AWS S3 and some S3-compatible providers
  s3MultipartMinChunkSize: "20971520"
  # Max size for multipart upload chunks in bytes (default 5Gb)
  s3MultipartMaxChunkSize: "5368709120"
  # Max number of parts for multipart upload
  s3MultipartMaxPartNumber: "10000"
  # Max object size for multipart upload in bytes (default 48.8 TiB)
  s3MaxObjectSize: "52776558133248"
  api:
    replicas: 1
    ingress:
      enabled: true
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "2G"
      extraLabels: {}
      maxBodySize: 2G
      tls: []
    hostname: "api-databox.{{ .Values.stack.domain }}"
    baseUrl: "https://api-databox.{{ .Values.stack.domain }}"
    # Override global resourceQuota for this service (true/false), defaults to global value
    # resourceQuota:
    resources:
      requests:
        cpu: "50m"
        memory: "256Mi"
      limits:
        cpu: "2000m"
        memory: "2048Mi"
    config:
      requestSignatureTtl: 86400
      roles:
        assetOwnerPropertyRequiredRole:
        collectionOwnerPropertyRequiredRole:
      s3Storage:
        # When using an external object storage provider, set the "endpoint" to the root domain of the service.
        # Example: https://s3.my-s3-provider.com
        # The "bucketName" will be prepended to this endpoint to form the full bucket URL (e.g., https://<bucketName>.s3.my-s3-provider.com).
        endpoint: "{{ tpl .Values.minio.baseUrl . }}"
        region: eu-west-3
        bucketName: databox
        # true for a local minio, false for an external object storage provider
        usePathStyleEndpoint: true 
        # Can be used to support a single CloudFront distribution with multiple origins
        pathPrefix: ''
        accessKey: "{{ .Values.minio.accessKey }}"
        secretKey: "{{ .Values.minio.secretKey }}"
        externalSecretKey:
        externalSecretMapping:
          accessKey: S3_ACCESS_KEY
          secretKey: S3_SECRET_KEY
      cloudFront:
        url:
        region: eu-west-3
        privateKey:
        keyPairId:
        ttl: 86400
      # Default Phraseanet instance used by the workspace integrations (PWI_PHRASEANET_URL / PWI_PHRASEANET_API_TOKEN)
      phraseanet:
        baseUrl:
        oauthToken:
      secrets:
        # __SET_ME__ sodium public/private key pair
        publicKey:
        # __SET_ME__
        secretKey:
  adminOAuthClient:
    externalSecretName:
    id: databox-admin
    secret: '__CHANGE_ME_9jZuZqkwf9qW881jTqG'
  client:
    hostname: "databox.{{ .Values.stack.domain }}"
    baseUrl: "https://databox.{{ .Values.stack.domain }}"
    # Port the container listens on: 3000 for the Next.js client, set 80 for images <= 4.4.2 (nginx)
    port: 3000
    # Override global resourceQuota for this service (true/false), defaults to global value
    # resourceQuota:
    resources:
      requests:
        cpu: "50m"
        memory: "128Mi"
      limits:
        cpu: "1000m"
        memory: "512Mi"
    ingress:
      enabled: true
      annotations: {}
      extraLabels: {}
      tls: []
    oauthClient:
      id: databox-app
    # Optional custom logo (APP_LOGO_SRC)
    logoSrc:
    # "Report an issue" button: tickets are created in JIRA server side
    ticketing:
      enabled: false
      # Existing Secret holding DATABOX_TICKETING_JIRA_API_TOKEN (otherwise created from jira.apiToken)
      externalSecretName:
      jira:
        url:
        # JIRA Cloud: account email (Basic auth). Leave empty for a Server/Data Center personal access token (Bearer)
        user:
        apiToken:
        projectKey:
        issueType: Task
        bugIssueType: Bug
        labels: databox
        # 3 for JIRA Cloud, 2 for Server/Data Center
        apiVersion: "3"
  worker:
    replicas: 1
    # Override global resourceQuota for this service (true/false), defaults to global value
    # resourceQuota:
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
  indexer:
    enabled: false
    # clientId and clientSecret are used by the configurator to register the indexer OAuth client
    clientId:
    clientSecret:
    # If set, the configurator creates this bucket (and its event notification when configurator.configure.minio is true)
    bucketName:
    # Default resources applied to all instances (can be overridden per instance)
    resources:
      requests:
        cpu: "100m"
        memory: "512Mi"
      limits:
        cpu: "2000m"
        memory: "1Gi"
    # List of indexer instances to deploy.
    # Each instance runs a command against a named location with its own JSON config file.
    #
    # TWO INDEPENDENT FIELDS:
    #   resourceType: Determines the Kubernetes resource type
    #     'deployment' → continuous long-running pods with replicas
    #     'cronjob'    → scheduled execution (requires 'schedule' field)
    #     'job'        → one-off manual execution (unique timestamp-based naming)
    #
    #   argument: Determines what operation the indexer performs
    #     'watch' → long-running watch daemon (continuous monitoring)
    #     'index' → one-time or scheduled indexing operation
    #
    # instances:
    #   # Deployment example: long-running watch daemon
    #   - name: sample-watch-daemon
    #     enabled: true                   # Optional, set false to keep config but skip deployment
    #     resourceType: deployment         # Creates Deployment with replicas
    #     argument: watch                  # Runs 'databox-indexer watch sample-source-a'
    #     location: sample-source-a        # Location name defined in config.json
    #     # Driver state storage (Phraseanet driver progress files)
    #     stateStorage:
    #       type: emptyDir                 # 'emptyDir' (default) or 'pvc'
    #       mountPath: /locks              # Mounted path used by INDEXER_LOCK_DIR
    #     podSecurityContext:              # Optional, useful with PVC write permissions
    #       fsGroup: 1000
    #       fsGroupChangePolicy: OnRootMismatch
    #     # Watch volume storage (filesystem/block mounted in pod for watch mode)
    #     # This section is volume-only. S3 event sources should live in another dedicated section.
    #     watchVolumeStorage:
    #       enabled: true
    #       type: pvc                      # 'emptyDir' or 'pvc'
    #       existingClaim: shared-watch-fs # Optional, if set no PVC is created
    #       mountPath: /fs-watch
    #       readOnly: true
    #       storageClass: nfs-rwx
    #       accessMode: ReadWriteMany
    #       size: 1Gi
    #     replicas: 1                      # Only for deployment
    #     config: |                        # Full JSON config file content
    #       {
    #         "databox": {
    #           "url": "%env(DATABOX_API_URL)%",
    #           "clientId": "%env(DATABOX_CLIENT_ID)%",
    #           "clientSecret": "%env(DATABOX_CLIENT_SECRET)%",
    #           "verifySSL": "%env(bool:DATABOX_VERIFY_SSL)%",
    #           "concurrency": "%env(int:DATABOX_CONCURRENCY)%"
    #         },
    #         "locations": [
    #           { "name": "acme", "type": "phraseanet", "options": { ... } }
    #         ]
    #       }
    #     env:                             # Non-sensitive env vars
    #       DATABOX_API_URL: "https://api-databox.xxx.zz"
    #       DATABOX_VERIFY_SSL: "true"
    #       DATABOX_CONCURRENCY: "1"
    #     envSecrets:                      # References to Kubernetes Secrets
    #       - secretName: my-indexer-credentials
    #     resources:                       # Per-instance resource override (optional)
    #       requests:
    #         cpu: "100m"
    #         memory: "512Mi"
    #       limits:
    #         cpu: "1000m"
    #         memory: "1Gi"
    #
    #   # CronJob example: scheduled indexing
    #   - name: sample-daily-index
    #     enabled: true                   # Optional, set false to disable this instance
    #     resourceType: cronjob            # Creates CronJob
    #     argument: index                   # Runs 'databox-indexer index sample-source-b'
    #     location: sample-source-b
    #     stateStorage:
    #       type: pvc                      # Create/use a PVC for lock persistence
    #       storageClass:
    #       accessMode: ReadWriteOnce
    #       size: 1Gi
    #       existingClaim:                 # Optional, if set no PVC is created
    #     schedule: "0 2 * * *"            # Required for cronjob (cron format)
    #     suspend: false                   # Set to true for manual-only triggering
    #     config: |
    #       { ... }
    #
    #   # Job example: one-off manual indexing
    #   - name: sample-manual-index
    #     enabled: false                  # Example: keep config without running hook Job
    #     resourceType: job                # Creates Job with timestamp-based name
    #     argument: index                  # Runs 'databox-indexer index sample-source-c'
    #     location: sample-source-c
    #     stateStorage:
    #       type: pvc
    #       existingClaim: shared-indexer-state
    #     config: |
    #       { ... }
    instances: []
  rabbitmq:
    vhost: databox
  database:
    name: databox
  upload:
    uploaderTargetSlug: databox-uploader
  # OAuth client (created by the configurator) used by the Expose integration of Databox.
  # Leave empty to disable.
  exposeIntegration:
    clientId: expose-integration
  zippy:
    enabled: true
    baseUrl: "https://zippy.{{ .Values.stack.domain }}"
    clientId: databox
    clientSecret: __CHANGE_ME_MxWoVddUWq

expose:
  enabled: true
  # this option enable the import of fixtures after setup
  # warning: this will erase existing data in databases.
  importFixtures: false
  # Min size for multipart upload chunks in bytes (default 20Mb) - must be at least 5Mb for AWS S3 and some S3-compatible providers
  s3MultipartMinChunkSize: "20971520"
  # Max size for multipart upload chunks in bytes (default 5Gb)
  s3MultipartMaxChunkSize: "5368709120"
  # Max number of parts for multipart upload
  s3MultipartMaxPartNumber: "10000"
  # Max object size for multipart upload in bytes (default 48.8 TiB)
  s3MaxObjectSize: "52776558133248"
