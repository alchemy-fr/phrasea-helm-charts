        oauthToken:
  adminOAuthClient:
    externalSecretName:
    id: expose-admin
    secret: '__CHANGE_ME_71EuDQ2H$ei3sHwIB0sfy'
  worker:
    replicas: 1
    # Override global resourceQuota for this service (true/false), defaults to global value
    # resourceQuota:
    resources:
      requests:
        cpu: "50m"
        memory: "256Mi"
      limits:
        cpu: "2000m"
        memory: "2048Mi"
  client:
    hostname: "expose.{{ .Values.stack.domain }}"
    baseUrl: "https://expose.{{ .Values.stack.domain }}"
    # Override global resourceQuota for this service (true/false), defaults to global value
    # resourceQuota:
    resources:
      requests:
        cpu: "25m"
        memory: "64Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    ingress:
      enabled: true
      annotations: {}
      extraLabels: {}
