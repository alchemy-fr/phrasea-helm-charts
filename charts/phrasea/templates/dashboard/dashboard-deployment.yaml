{{- with .Values.dashboard }}
{{- if and $.Values.stack.running .enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phrasea
      tier: dashboard
  template:
    metadata:
      labels:
        app: phrasea
        tier: dashboard
    spec:
      {{ include "imagePullSecrets" $ | indent 6 }}
      {{- if $.Values.nodeSelector }}
      nodeSelector: {{ toYaml $.Values.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
      - name: dashboard
        image: {{ $.Values.repository.baseUrl }}/ps-dashboard:{{ $.Values.repository.tag }}
        imagePullPolicy: {{ $.Values.repository.imagePullPolicy }}
        {{- if eq "true" (include "ps.resourceQuota" (dict "local" .resourceQuota "global" $.Values.resourceQuota)) }}
        resources:
          requests:
            memory: {{ .resources.requests.memory }}
            cpu: {{ .resources.requests.cpu }}
          limits:
            memory: {{ .resources.limits.memory }}
            cpu: {{ .resources.limits.cpu }}
        {{- end }}
        ports:
        - name: http
          containerPort: 3000
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        terminationMessagePolicy: FallbackToLogsOnError
        envFrom:
        - configMapRef:
            name: client-config
        - configMapRef:
            name: urls-config
        - configMapRef:
            name: configurator-s3
        - configMapRef:
            name: dashboard-client-config
{{- end }}
{{- end }}
