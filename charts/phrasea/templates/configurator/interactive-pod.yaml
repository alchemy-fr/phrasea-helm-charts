{{- if and $.Values.stack.running $.Values.interactivePod.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: configurator-interactive
  labels:
    app: phrasea
    tier: configurator-interactive
spec:
  {{- include "imagePullSecrets" . | indent 2 }}
  {{- if .Values.nodeSelector }}
  nodeSelector: {{ toYaml .Values.nodeSelector | nindent 4 }}
  {{- end }}
  containers:
  - name: configurator-interactive
    image: alpine:latest
    imagePullPolicy: IfNotPresent
    stdin: true
    stdinOnce: false
    tty: true
    command: ["/bin/sh"]
    args: ["-c", "apk add --no-cache curl jq postgresql-client zsh && /bin/zsh"]
    env:
    # PostgreSQL standard environment variables (for psql CLI)
    - name: PGHOST
      value: {{ .Values.postgresql.host | quote }}
    - name: PGPORT
      value: {{ .Values.postgresql.port | quote }}
    - name: PGUSER
      valueFrom:
        secretKeyRef:
          name: {{ .Values.postgresql.externalSecretName | default "postgresql-secret" }}
          key: POSTGRES_USER
    - name: PGPASSWORD
      valueFrom:
        secretKeyRef:
          name: {{ .Values.postgresql.externalSecretName | default "postgresql-secret" }}
          key: POSTGRES_PASSWORD
    - name: PGDATABASE
      value: {{ .Values.configurator.database.name | quote }}
    envFrom:
    - configMapRef:
        name: php-config
    - configMapRef:
        name: postgresql-php-config
    - configMapRef:
        name: rabbitmq-php-config
    - secretRef:
        name: {{ include "secretName.postgresql" . }}
    - secretRef:
        name: {{ include "secretName.rabbitmq" . }}
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  restartPolicy: Never
{{- end }}
