{{- if .Values.expose.enabled }}
{{- with .Values.expose }}
{{- if .matomo.enabled }}
{{- with .matomo }}
apiVersion: v1
kind: Secret
metadata:
  name: matomo
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-300"
stringData:
  MATOMO_AUTH_TOKEN: {{ required "Missing expose.matomo.authToken" .authToken | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
