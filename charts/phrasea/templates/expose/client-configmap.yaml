{{- with .Values.expose }}
{{- if .enabled }}
{{- $tplArgs := dict "ctx" . "glob" $ }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: expose-client-config
data:
  DISABLE_INDEX_PAGE: {{ .client.disableIndexPage | quote }}
  {{- with .api.config.cloudFront.url }}
  CLOUD_FRONT_URL: {{ tpl . $ | quote }}
  {{- end }}
  {{- include "app.client.configMap" $tplArgs | indent 2 }}
{{- end }}
{{- end }}
