{{- if .Values.databox.enabled }}
{{- with .Values.databox.api.config.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: databox-secrets
stringData:
  SECRETS_PUBLIC_KEY: {{ required "Missing databox.api.config.secrets.publicKey value" .publicKey | quote }}
  PWI_PHRASEANET_API_TOKEN: {{ $.Values.databox.api.config.phraseanet.oauthToken | default "" | quote }}
---
# Only mounted in the workers (and cron jobs): decrypts the workspace secrets
apiVersion: v1
kind: Secret
metadata:
  name: databox-worker-secrets
stringData:
  SECRETS_SECRET_KEY: {{ required "Missing databox.api.config.secrets.secretKey value" .secretKey | quote }}
---
{{- end }}
{{- end }}
