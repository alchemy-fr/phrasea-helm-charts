{{- if and $.Values.stack.running .Values.databox.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: databox-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phrasea
      tier: databox-client
  template:
    metadata:
      labels:
        app: phrasea
        tier: databox-client
    spec:
      {{ include "imagePullSecrets" $ | indent 6 }}
      {{- if $.Values.nodeSelector }}
      nodeSelector: {{ toYaml $.Values.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
      - name: databox-client
        image: {{ $.Values.repository.baseUrl }}/ps-databox-client:{{ $.Values.repository.tag }}
        imagePullPolicy: {{ $.Values.repository.imagePullPolicy }}
        {{- if eq "true" (include "ps.resourceQuota" (dict "local" $.Values.databox.client.resourceQuota "global" $.Values.resourceQuota)) }}
        resources:
          requests:
            memory: {{ $.Values.databox.client.resources.requests.memory }}
            cpu: {{ $.Values.databox.client.resources.requests.cpu }}
          limits:
            memory: {{ $.Values.databox.client.resources.limits.memory }}
            cpu: {{ $.Values.databox.client.resources.limits.cpu }}
        {{- end }}
        ports:
        - name: http
          containerPort: {{ $.Values.databox.client.port }}
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        terminationMessagePolicy: FallbackToLogsOnError
        envFrom:
        - configMapRef:
            name: client-config
        - configMapRef:
            name: urls-config
        - configMapRef:
            name: soketi
            optional: true
        - configMapRef:
            name: databox-client-config
        - configMapRef:
            name: configurator-s3
        {{- with $.Values.databox.client.ticketing }}
        {{- if .enabled }}
        - secretRef:
            name: {{ .externalSecretName | default "databox-client-ticketing" }}
        {{- end }}
        {{- end }}
{{- end }}
