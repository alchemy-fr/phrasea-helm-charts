{{- if and $.Values.stack.running .Values.databox.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: databox-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phrasea
      tier: databox-client
  template:
    metadata:
      labels:
        app: phrasea
        tier: databox-client
    spec:
      {{ include "imagePullSecrets" $ | indent 6 }}
      {{- if $.Values.nodeSelector }}
      nodeSelector: {{ toYaml $.Values.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
      - name: databox-client
        image: {{ $.Values.repository.baseurl }}/ps-databox-client:{{ $.Values.repository.tag }}
        imagePullPolicy: {{ $.Values.repository.imagePullPolicy }}
        {{- if eq "true" (include "ps.resourceQuota" (dict "local" $.Values.databox.client.resourceQuota "global" $.Values.resourceQuota)) }}
        resources:
          requests:
            memory: {{ $.Values.databox.client.resources.requests.memory | default "64Mi" }}
            cpu: {{ $.Values.databox.client.resources.requests.cpu | default "25m" }}
          limits:
            memory: {{ $.Values.databox.client.resources.limits.memory | default "256Mi" }}
            cpu: {{ $.Values.databox.client.resources.limits.cpu | default "500m" }}
        {{- end }}
        terminationMessagePolicy: FallbackToLogsOnError
        envFrom:
        - configMapRef:
            name: client-config
        - configMapRef:
            name: urls-config
        - configMapRef:
            name: novu
        - configMapRef:
            name: soketi
        - configMapRef:
            name: databox-client-config
        - configMapRef:
            name: configurator-s3
{{- end }}
