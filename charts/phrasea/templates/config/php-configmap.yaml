apiVersion: v1
kind: ConfigMap
metadata:
  name: php-config
data:
  APP_ENV: prod
  VERIFY_SSL: {{ .Values.security.verifySsl | default true | quote }}
  TRUSTED_PROXIES: 127.0.0.1,REMOTE_ADDR
  NOTIFICATIONS_ENABLED: {{ .Values.notifications.enabled | default false | quote }}
{{- if .Values.newrelic.enabled }}
  NEWRELIC_ENABLED: "1"
  NEWRELIC_LICENSE_KEY: {{ required "Missing newrelic.licenceKey" .Values.newrelic.licenceKey | quote }}
{{- end }}
{{- $sentryBackendEnabled := .Values.sentry.backend.enabled | default false }}
{{- $sentryBackendDsn := .Values.sentry.backend.dsn }}
{{- if $sentryBackendEnabled }}
  SENTRY_DSN: {{ required "Missing sentry backend DSN (sentry.backend.dsn)" $sentryBackendDsn | quote }}
  SENTRY_ENVIRONMENT: {{ required "Missing sentry environment (sentry.environment)" .Values.sentry.environment | quote }}
{{- end }}
