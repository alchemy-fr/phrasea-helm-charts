apiVersion: v1
kind: ConfigMap
metadata:
  name: urls-config
data:
  STACK_NAME: {{ .Values.stack.name | default "" | quote }}
  STACK_VERSION: {{ .Values.repository.tag | quote }}
  REPORT_API_URL: {{ required "Missing report.api.baseUrl" .Values.report.api.baseUrl | quote }}
  KEYCLOAK_URL: {{ tpl (.Values.keycloak.baseUrl | required "Missing keycloak.baseUrl") . | quote }}
  KEYCLOAK_INTERNAL_URL: {{ required "Missing keycloak.internalBaseUrl" .Values.keycloak.internalBaseUrl | quote }}
  KEYCLOAK_REALM_NAME: {{ required "Missing mailer.dsn value" .Values.keycloak.realm.name | quote }}
  EXPOSE_API_URL: {{ tpl (.Values.expose.api.baseUrl | required "Missing expose.api.baseUrl") . | quote }}
  EXPOSE_CLIENT_URL: {{ tpl (.Values.expose.client.baseUrl | required "Missing expose.client.baseUrl") . | quote }}
  DATABOX_API_URL: {{ tpl (.Values.databox.api.baseUrl | required "Missing databox.api.baseUrl") . | quote }}
  DATABOX_CLIENT_URL: {{ tpl (.Values.databox.client.baseUrl | required "Missing databox.client.baseUrl") . | quote }}
  UPLOADER_API_URL: {{ tpl (.Values.uploader.api.baseUrl | required "Missing uploader.api.baseUrl") . | quote }}
  UPLOADER_CLIENT_URL: {{ tpl (.Values.uploader.client.baseUrl | required "Missing uploader.client.baseUrl") . | quote }}
  DASHBOARD_URL: {{ tpl (.Values.dashboard.baseUrl | required "Missing dashboard.baseUrl") . | quote }}
  DASHBOARD_CLIENT_URL: {{ tpl (.Values.dashboard.baseUrl | required "Missing dashboard.baseUrl") . | quote }}
  DOCUMENTATION_URL: {{ if .Values.documentation.enabled }}{{ tpl (.Values.documentation.baseUrl) . | quote }}{{ else }}"https://docs.phrasea.com"{{ end }}
  DISPLAY_SERVICES_MENU: {{ ternary "true" "false" .Values.dashboard.menuEnabled | quote }}
