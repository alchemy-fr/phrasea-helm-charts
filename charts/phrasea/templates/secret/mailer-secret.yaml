apiVersion: v1
kind: Secret
metadata:
  name: mailer
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-10"
    "helm.sh/resource-policy": "keep"
stringData:
  MAILER_USER: {{ .Values.mailer.user | default "" | quote }}
  MAILER_PASSWORD: {{ .Values.mailer.password | default "" | quote }}
---