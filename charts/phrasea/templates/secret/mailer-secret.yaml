{{- with .Values.mailer }}
apiVersion: v1
kind: Secret
metadata:
  name: mailer
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-10"
    "helm.sh/resource-policy": "keep"
stringData:
  MAILER_USER: {{ .user | default "" | quote }}
  MAILER_PASSWORD: {{ .password | default "" | quote }}
  MAILER_DSN: {{ tpl (.dsn| default "") $ | quote }}
---
{{- end }}
