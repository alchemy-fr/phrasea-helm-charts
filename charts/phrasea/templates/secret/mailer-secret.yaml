{{- with .Values.mailer }}
{{- if not .externalSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: mailer
stringData:
  # See mailer-configmap.yaml for the mailpit override rationale. No auth is
  # needed here: Mailpit's SMTP has no authentication and is only reachable
  # over the cluster's internal network.
  MAILER_USER: {{ ternary "" (.user | default "") $.Values.mailpit.enabled | quote }}
  MAILER_PASSWORD: {{ ternary "" (.password | default "") $.Values.mailpit.enabled | quote }}
  MAILER_DSN: {{ ternary "smtp://mailpit:1025" (tpl (.dsn | default "") $) $.Values.mailpit.enabled | quote }}
{{- end }}
{{- end }}
