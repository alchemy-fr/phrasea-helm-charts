{{- range .Values._internal.services }}
{{ $appName := . }}
{{- with (index $.Values $appName)  }}
{{- if .api  }}
{{- if .api.config  }}
{{- if .api.config.s3Storage }}
{{- if not .api.config.s3Storage.externalSecretKey  }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $appName }}-s3-secret
stringData:
  S3_ACCESS_KEY: {{ tpl .api.config.s3Storage.accessKey $ | required "Missing api.config.s3Storage.accessKey" | quote }}
  S3_SECRET_KEY: {{ tpl .api.config.s3Storage.secretKey $ | required "Missing api.config.s3Storage.secretKey" | quote }}
---
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
