{{- range .Values._internal.services }}
{{- $appName := . }}
{{- with (index $.Values $appName) }}
{{- if and .enabled (not .appSecret.externalSecretName) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $appName }}-app-secret
  # A hook, since the pre-upgrade Jobs read it: the regular resources of the
  # release are only applied after the pre-upgrade hooks.
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-20"
    "helm.sh/resource-policy": "keep"
stringData:
  APP_SECRET: {{ required (printf "Missing %s.appSecret.value" $appName) .appSecret.value | quote }}
---
{{- end }}
{{- end }}
{{- end }}
