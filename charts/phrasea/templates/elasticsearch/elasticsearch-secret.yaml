{{- with .Values.elasticsearch }}
{{- if and $.Values.databox.enabled (not .externalSecretName) }}
{{- $username := .username | default "" }}
{{- $password := .password | default "" }}
{{- if .enabled }}
{{- $username = required "Missing elasticsearch.username: the bundled Elasticsearch requires authentication" .username }}
{{- $password = required "Missing elasticsearch.password: the bundled Elasticsearch requires authentication" .password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: databox-elasticsearch
  # A hook, since the pre-upgrade Jobs read it: the regular resources of the
  # release are only applied after the pre-upgrade hooks.
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-20"
    "helm.sh/resource-policy": "keep"
stringData:
  ELASTICSEARCH_USERNAME: {{ $username | quote }}
  ELASTICSEARCH_PASSWORD: {{ $password | quote }}
{{- end }}
{{- end }}
