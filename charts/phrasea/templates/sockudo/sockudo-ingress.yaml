{{- if and $.Values.stack.running $.Values.sockudo.enabled $.Values.sockudo.ingress.enabled }}
apiVersion: {{ template "ingress.apiVersion" $ }}
kind: Ingress
metadata:
  name: sockudo
  labels:
    app: phrasea
    tier: sockudo
  {{- with $.Values.sockudo.ingress.extraLabels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with include "ingress.annotations" (dict "_" $ "annotations" $.Values.sockudo.ingress.annotations) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
{{- with include "ingress.className" $ }}
  {{- . | nindent 2 }}
{{- end }}
  rules:
    - host: {{ tpl $.Values.sockudo.host $ | quote }}
      http:
        paths:
        {{- include "ingress.rule_path" (dict "_" $ "name" "sockudo" "port" 80) | indent 8 }}
{{- if $.Values.sockudo.ingress.tls }}
{{- $tlsNode := $.Values.sockudo.ingress.tls -}}
{{- range $value := $tlsNode }}
  {{- if not (hasKey $value "hosts") }}
    {{- $_ := set $value "hosts" (list (tpl $.Values.sockudo.host $)) }}
  {{- end -}}
{{- end }}
  tls:
{{ toYaml $tlsNode | indent 2 }}
{{- else if $.Values.ingress.tls.wildcard.enabled }}
  tls:
    - hosts:
        - {{ tpl $.Values.sockudo.host $ | quote }}
      secretName: {{ include "secretRef.ingress.tls.wildcard" $ }}
{{- end }}
{{- end }}
{{- if and $.Values.stack.running $.Values.sockudo.enabled $.Values.sockudo.ingress.enabled }}
{{- $traefik := eq ($.Values.ingress.className | default "") "traefik" }}
{{- if $traefik }}
---
# Rejects every client (403): attached to the sockudo-internal-paths Ingress below.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sockudo-internal-paths-deny
  labels:
    app: phrasea
    tier: sockudo
  {{- with $.Values.sockudo.ingress.extraLabels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
{{- end }}
---
# Sockudo serves /usage, /stats and /operator on the app port: these paths are denied to
# every client, through a deny-all Middleware with Traefik, through the denylist
# annotation with ingress-nginx (which merges this Ingress into the same server).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sockudo-internal-paths
  labels:
    app: phrasea
    tier: sockudo
  {{- with $.Values.sockudo.ingress.extraLabels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
  {{- if $traefik }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Release.Namespace }}-sockudo-internal-paths-deny@kubernetescrd
  {{- else }}
    nginx.ingress.kubernetes.io/denylist-source-range: "0.0.0.0/0,::/0"
  {{- end }}
spec:
{{- with include "ingress.className" $ }}
  {{- . | nindent 2 }}
{{- end }}
  rules:
    - host: {{ tpl $.Values.sockudo.host $ | quote }}
      http:
        paths:
        {{- range list "/usage" "/stats" "/operator" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: sockudo
                port:
                  number: 80
        {{- end }}
{{- end }}
