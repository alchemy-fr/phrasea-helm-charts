{{- if and $.Values.stack.running $.Values.sockudo.enabled $.Values.sockudo.ingress.enabled }}
apiVersion: {{ template "ingress.apiVersion" $ }}
kind: Ingress
metadata:
  name: sockudo
  labels:
    app: phrasea
    tier: sockudo
  {{- with $.Values.sockudo.ingress.extraLabels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with include "ingress.annotations" (dict "_" $ "name" "sockudo" "ingress" $.Values.sockudo.ingress) }}
  {{- . | nindent 2 }}
  {{- end }}
spec:
{{- with include "ingress.className" $ }}
  {{- . | nindent 2 }}
{{- end }}
  rules:
    - host: {{ tpl $.Values.sockudo.host $ | quote }}
      http:
        paths:
        {{- include "ingress.rule_path" (dict "_" $ "name" "sockudo" "port" 80) | indent 8 }}
{{- if $.Values.sockudo.ingress.tls }}
{{- $tlsNode := $.Values.sockudo.ingress.tls -}}
{{- range $value := $tlsNode }}
  {{- if not (hasKey $value "hosts") }}
    {{- $_ := set $value "hosts" (list (tpl $.Values.sockudo.host $)) }}
  {{- end -}}
{{- end }}
  tls:
{{ toYaml $tlsNode | indent 2 }}
{{- else if $.Values.ingress.tls.wildcard.enabled }}
  tls:
    - hosts:
        - {{ tpl $.Values.sockudo.host $ | quote }}
      secretName: {{ include "secretRef.ingress.tls.wildcard" $ }}
{{- end }}
{{- include "ingress.ipAllowlistMiddleware" (dict "_" $ "name" "sockudo" "ingress" $.Values.sockudo.ingress) }}
{{- end }}
{{- if and $.Values.stack.running $.Values.sockudo.enabled $.Values.sockudo.ingress.enabled }}
{{- $traefik := eq ($.Values.ingress.className | default "") "traefik" }}
{{- if $traefik }}
---
# Rejects every client (403): attached to the sockudo-internal-paths Ingress below.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sockudo-internal-paths-deny
  labels:
    app: phrasea
    tier: sockudo
  {{- with $.Values.sockudo.ingress.extraLabels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
{{- end }}
---
# Sockudo serves /usage, /stats and /operator on the app port: these paths are denied to
# every client, through a deny-all Middleware with Traefik, through the denylist
# annotation with ingress-nginx (which merges this Ingress into the same server).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sockudo-internal-paths
  labels:
    app: phrasea
    tier: sockudo
  {{- with $.Values.sockudo.ingress.extraLabels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
  {{- if $traefik }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Release.Namespace }}-sockudo-internal-paths-deny@kubernetescrd
  {{- else }}
    nginx.ingress.kubernetes.io/denylist-source-range: "0.0.0.0/0,::/0"
  {{- end }}
spec:
{{- with include "ingress.className" $ }}
  {{- . | nindent 2 }}
{{- end }}
  rules:
    - host: {{ tpl $.Values.sockudo.host $ | quote }}
      http:
        paths:
        {{- range list "/usage" "/stats" "/operator" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: sockudo
                port:
                  number: 80
        {{- end }}
{{- end }}
{{- if and $.Values.stack.running $.Values.sockudo.enabled $.Values.sockudo.ingress.enabled $.Values.sockudo.usage.ipAllowlist }}
{{- /* Only the usage allowlist applies: neither ingress.ipAllowlist nor ingress.middlewares */}}
{{- $usageList := $.Values.sockudo.usage.ipAllowlist | uniq | join "," }}
{{- $traefik := eq ($.Values.ingress.className | default "") "traefik" }}
---
# /usage published on a dedicated host, restricted to sockudo.usage.ipAllowlist (a host of its
# own: ingress-nginx rejects two Ingresses declaring the same host and path).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sockudo-usage
  labels:
    app: phrasea
    tier: sockudo
  {{- with $.Values.sockudo.ingress.extraLabels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
  {{- if $traefik }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Release.Namespace }}-sockudo-usage-ip-allowlist@kubernetescrd
  {{- else }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ $usageList | quote }}
  {{- end }}
spec:
{{- with include "ingress.className" $ }}
  {{- . | nindent 2 }}
{{- end }}
  rules:
    - host: {{ tpl $.Values.sockudo.usage.host $ | quote }}
      http:
        paths:
          - path: /usage
            pathType: Prefix
            backend:
              service:
                name: sockudo
                port:
                  number: 80
{{- if $.Values.sockudo.usage.tls }}
  tls:
{{ toYaml $.Values.sockudo.usage.tls | indent 4 }}
{{- else if $.Values.ingress.tls.wildcard.enabled }}
  tls:
    - hosts:
        - {{ tpl $.Values.sockudo.usage.host $ | quote }}
      secretName: {{ include "secretRef.ingress.tls.wildcard" $ }}
{{- end }}
{{- if $traefik }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sockudo-usage-ip-allowlist
  labels:
    app: phrasea
    tier: sockudo
spec:
  ipAllowList:
    sourceRange:
    {{- range splitList "," $usageList }}
      - {{ . | quote }}
    {{- end }}
{{- end }}
{{- end }}
