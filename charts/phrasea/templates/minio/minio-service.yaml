{{- if and $.Values.stack.running .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: minio
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-196"
spec:
  ports:
  - name: minio
    port: 80
    targetPort: 9000
  selector:
    app: phrasea
    tier: minio
{{- end }}
