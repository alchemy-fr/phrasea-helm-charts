{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-300"
stringData:
  MINIO_ACCESS_KEY: {{ quote .Values.minio.accessKey }}
  MINIO_SECRET_KEY: {{ quote .Values.minio.secretKey }}
{{- end }}
