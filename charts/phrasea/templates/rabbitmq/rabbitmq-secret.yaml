{{- with .Values.rabbitmq }}
{{- if not .externalSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-300"
stringData:
  RABBITMQ_USER: {{ quote .user }}
  RABBITMQ_PASSWORD: {{ quote .password }}
{{- end }}
{{- end }}
