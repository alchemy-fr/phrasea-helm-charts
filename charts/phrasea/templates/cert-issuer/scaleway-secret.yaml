{{- if .Values.acme.enabled }}
{{- with .Values.acme }}
{{- if eq .provider "scaleway" }}
{{- if and .scaleway.accessKey .scaleway.secretKey (not .scaleway.existingSecretName) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "ps.fullname" $ }}-scaleway-credentials
  namespace: cert-manager
  labels:
    app: phrasea
    component: cert-manager
    provider: scaleway
type: Opaque
stringData:
  SCW_ACCESS_KEY: {{ required "Missing acme.scaleway.accessKey" .scaleway.accessKey | quote }}
  SCW_SECRET_KEY: {{ required "Missing acme.scaleway.secretKey" .scaleway.secretKey | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
