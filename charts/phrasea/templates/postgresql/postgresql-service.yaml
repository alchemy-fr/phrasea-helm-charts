{{- with .Values.postgresql }}
{{- if .enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-200"
spec:
  ports:
  - name: postgre
    port: 5432
    targetPort: 5432
  selector:
    app: phrasea
    tier: postgresql
{{- end }}
{{- end }}
